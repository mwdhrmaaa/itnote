<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Note</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <div class="lang-selector">
                <i data-lucide="languages" class="lang-icon"></i>
                <select id="lang-select">
                    <option value="en">English</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ja">日本語</option>
                    <option value="zh">简体中文</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </nav>

        <header>
            <h1 id="ui-title">IT Note</h1>
            <p id="ui-subtitle">Daftar istilah IT untuk membantu perjalanan belajar kamu.</p>
        </header>

        <div class="search-container">
            <div class="search-wrapper">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" placeholder="Cari istilah IT (misal: API, Docker, Cloud)...">
            </div>
        </div>

        <div id="terms-grid" class="terms-grid">
            <!-- Terms will be rendered here by JS -->
        </div>
    </div>

    <!-- Modal for details -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <button id="close-modal" class="close-modal">&times;</button>
            <div id="modal-category" class="modal-category"></div>
            <h2 id="modal-title" class="modal-title"></h2>
            <p id="modal-definition" class="modal-definition"></p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
